name: IDA SDK Build Test

on:
  push:
    branches: [ ci ]
  pull_request:
    branches: [ ci ]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      IDASDK: ${{ github.workspace }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Visual Studio Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          src/build/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('src/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      working-directory: src
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build SDK (without Qt)
      working-directory: src
      run: cmake --build build --config Release --parallel --verbose

    - name: Build Statistics
      working-directory: src
      shell: bash
      run: |
        echo "=== Build Results ==="
        echo "Plugins: $(ls -1 bin/plugins/*.dll 2>/dev/null | wc -l)"
        echo "Loaders: $(ls -1 bin/loaders/*.dll 2>/dev/null | wc -l)"
        echo "Processors: $(ls -1 bin/procs/*.dll 2>/dev/null | wc -l)"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ida-sdk-build
        path: |
          src/bin/plugins/*.dll
          src/bin/loaders/*.dll
          src/bin/procs/*.dll
        retention-days: 7
