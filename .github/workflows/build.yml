name: IDA SDK Build Test

on:
  push:
    branches: [ main, build/cmake ]
  pull_request:
    branches: [ main, build/cmake ]

jobs:
  # SDK build jobs — one per platform via the reusable sdk-build workflow.
  build-windows:
    uses: ./.github/workflows/sdk-build.yml
    with:
      platform: windows
      os: windows-latest

  build-linux:
    uses: ./.github/workflows/sdk-build.yml
    with:
      platform: linux
      os: ubuntu-latest

  build-macos:
    uses: ./.github/workflows/sdk-build.yml
    with:
      platform: macos
      os: macos-latest

  # IDAPython build jobs — each platform starts as soon as its SDK build completes.
  idapython-windows:
    needs: build-windows
    uses: ./.github/workflows/idapython-build.yml
    with:
      platform: windows
      os: windows-latest
      sdk-artifact: sdk-build-windows

  idapython-linux:
    needs: build-linux
    uses: ./.github/workflows/idapython-build.yml
    with:
      platform: linux
      os: ubuntu-latest
      sdk-artifact: sdk-build-linux

  idapython-macos:
    needs: build-macos
    uses: ./.github/workflows/idapython-build.yml
    with:
      platform: macos
      os: macos-latest
      sdk-artifact: sdk-build-macos
