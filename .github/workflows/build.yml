name: IDA SDK Build Test

on:
  push:
    branches: [ ci ]
  pull_request:
    branches: [ ci ]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      IDASDK: ${{ github.workspace }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Visual Studio Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: |
          src/build/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('src/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      working-directory: src
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build SDK (without Qt)
      working-directory: src
      continue-on-error: true
      run: cmake --build build --config Release --parallel

    - name: Build Statistics
      working-directory: src
      shell: bash
      run: |
        echo "=== Build Results ==="
        echo "Plugins: $(ls -1 bin/plugins/*.dll 2>/dev/null | wc -l)"
        echo "Loaders: $(ls -1 bin/loaders/*.dll 2>/dev/null | wc -l)"
        echo "Processors: $(ls -1 bin/procs/*.dll 2>/dev/null | wc -l)"
        echo ""
        echo "Note: Some debugger component failures are expected (runtime library mismatch)"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ida-sdk-build-windows
        path: |
          src/bin/plugins/*.dll
          src/bin/loaders/*.dll
          src/bin/procs/*.dll
        retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    env:
      IDASDK: ${{ github.workspace }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build

    - name: Configure CMake
      working-directory: src
      run: cmake -B build -G Ninja

    - name: Build SDK (without Qt)
      working-directory: src
      continue-on-error: true
      run: cmake --build build --parallel

    - name: Build Statistics
      working-directory: src
      run: |
        echo "=== Build Results ==="
        echo "Plugins: $(ls -1 bin/plugins/*.so 2>/dev/null | wc -l)"
        echo "Loaders: $(ls -1 bin/loaders/*.so 2>/dev/null | wc -l)"
        echo "Processors: $(ls -1 bin/procs/*.so 2>/dev/null | wc -l)"
        echo ""
        echo "Note: Some debugger component failures are expected"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ida-sdk-build-linux
        path: |
          src/bin/plugins/*.so
          src/bin/loaders/*.so
          src/bin/procs/*.so
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    env:
      IDASDK: ${{ github.workspace }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        brew install cmake ninja

    - name: Configure CMake
      working-directory: src
      run: cmake -B build -G Ninja

    - name: Build SDK (without Qt)
      working-directory: src
      continue-on-error: true
      run: cmake --build build --parallel

    - name: Build Statistics
      working-directory: src
      run: |
        echo "=== Build Results ==="
        echo "Plugins: $(ls -1 bin/plugins/*.dylib 2>/dev/null | wc -l)"
        echo "Loaders: $(ls -1 bin/loaders/*.dylib 2>/dev/null | wc -l)"
        echo "Processors: $(ls -1 bin/procs/*.dylib 2>/dev/null | wc -l)"
        echo ""
        echo "Note: Some debugger component failures are expected"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ida-sdk-build-macos
        path: |
          src/bin/plugins/*.dylib
          src/bin/loaders/*.dylib
          src/bin/procs/*.dylib
        retention-days: 7
